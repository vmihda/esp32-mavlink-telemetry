; ESP32 companion computer: MAVLink telemetry from ArduPilot FC -> CSV on LittleFS -> Wi-Fi web UI
;
; Wiring (SpeedyBee F4 V3, ArduPilot SERIAL6 = UART6):
;   FC T6  -> ESP32 GPIO16 (RX2)
;   FC R6  <- ESP32 GPIO17 (TX2)
;   FC GND -- ESP32 GND
; FC params: SERIAL6_PROTOCOL = 2 (MAVLink2), SERIAL6_BAUD = 115

[platformio]
default_envs = esp32doit-devkit-v1

[common]
lib_deps =
    https://github.com/mavlink/c_library_v2.git

[env:esp32doit-devkit-v1]
platform = espressif32
board = esp32doit-devkit-v1
framework = arduino
board_build.filesystem = littlefs
board_build.partitions = partitions.csv
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
lib_deps = ${common.lib_deps}
build_flags =
    -Wno-address-of-packed-member
test_ignore = test_native*

; Host-side unit tests for hardware-independent logic: pio test -e native
[env:native]
platform = native
lib_deps = ${common.lib_deps}
build_flags =
    -std=gnu++17
    -Wno-address-of-packed-member
lib_compat_mode = off
